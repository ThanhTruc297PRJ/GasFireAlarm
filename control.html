<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gas Alarm – Bảng điều khiển</title>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 20px;
    letter-spacing: 2px;
    color: #aaa;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  #status-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    margin-right: 6px;
    vertical-align: middle;
  }
  #status-dot.on { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }

  #status-label { font-size: 13px; color: #777; margin-bottom: 28px; }

  .card {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: #666;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .slider-row {
    margin-bottom: 20px;
  }

  .slider-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .slider-label span:last-child {
    font-weight: bold;
    font-size: 18px;
    color: #fff;
    min-width: 60px;
    text-align: right;
  }

  input[type=range] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  #gas-slider { background: linear-gradient(to right, #27ae60, #f39c12, #c0392b); }
  #temp-slider { background: linear-gradient(to right, #3498db, #e67e22, #c0392b); }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  /* Flame toggle */
  .flame-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .flame-label { font-size: 14px; }

  .toggle {
    position: relative;
    width: 60px; height: 30px;
    cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: #333;
    border-radius: 30px;
    transition: background 0.3s;
  }
  .toggle input:checked ~ .toggle-track { background: #c0392b; box-shadow: 0 0 10px #c0392b88; }
  .toggle-thumb {
    position: absolute;
    top: 4px; left: 4px;
    width: 22px; height: 22px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.3s;
  }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(30px); }

  /* State badge */
  #state-badge {
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    background: #27ae60;
    color: #fff;
    transition: background 0.4s;
    margin-bottom: 16px;
  }

  /* Auto/manual mode */
  .mode-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #111;
    color: #aaa;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
    transition: all 0.2s;
  }
  .mode-btn.active {
    border-color: #3498db;
    background: #1a3a5c;
    color: #fff;
  }

  /* Send button */
  #send-btn {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    background: #2980b9;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  #send-btn:hover { background: #3498db; }
  #send-btn:active { transform: scale(0.98); background: #1a6fa0; }
  #send-btn:disabled { background: #444; cursor: default; }

  /* Preset buttons */
  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .preset-btn {
    flex: 1;
    min-width: 100px;
    padding: 10px 8px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #111;
    color: #ccc;
    cursor: pointer;
    font-size: 12px;
    text-align: center;
    transition: all 0.2s;
  }
  .preset-btn:hover { filter: brightness(1.3); }
  .preset-btn.bt { border-color: #27ae60; color: #27ae60; }
  .preset-btn.cb { border-color: #f39c12; color: #f39c12; }
  .preset-btn.nh { border-color: #e67e22; color: #e67e22; }
  .preset-btn.ch { border-color: #c0392b; color: #c0392b; }

  #log {
    width: 100%;
    max-width: 480px;
    font-size: 11px;
    color: #555;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>🎛️ Bảng điều khiển cảm biến</h1>
<div id="status-label"><span id="status-dot"></span><span id="status-text">Đang kết nối MQTT...</span></div>

<div id="state-badge">✅ BINH THUONG</div>

<!-- Preset buttons -->
<div class="card">
  <div class="card-title">Chế độ nhanh</div>
  <div class="preset-row">
    <button class="preset-btn bt" onclick="applyPreset(150,24,false)">✅ Bình thường</button>
    <button class="preset-btn cb" onclick="applyPreset(400,35,false)">⚠️ Cảnh báo</button>
    <button class="preset-btn nh" onclick="applyPreset(600,55,false)">🚨 Nguy hiểm</button>
    <button class="preset-btn ch" onclick="applyPreset(600,55,true)">🔥 Cháy</button>
  </div>
</div>

<!-- Sliders -->
<div class="card">
  <div class="card-title">Giá trị cảm biến</div>

  <div class="slider-row">
    <div class="slider-label">
      <span>💨 Gas (ppm)</span>
      <span id="gas-val">150</span>
    </div>
    <input type="range" id="gas-slider" min="0" max="1023" value="150"
           oninput="document.getElementById('gas-val').textContent=this.value; updateState()">
  </div>

  <div class="slider-row">
    <div class="slider-label">
      <span>🌡️ Nhiệt độ (°C)</span>
      <span id="temp-val">24</span>
    </div>
    <input type="range" id="temp-slider" min="0" max="100" value="24"
           oninput="document.getElementById('temp-val').textContent=this.value; updateState()">
  </div>

  <div class="flame-row">
    <span class="flame-label">🔥 Phát hiện lửa</span>
    <label class="toggle">
      <input type="checkbox" id="flame-toggle" onchange="updateState()">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>
</div>

<!-- Auto send -->
<div class="card">
  <div class="card-title">Chế độ gửi</div>
  <div class="mode-row">
    <div class="mode-btn active" id="btn-auto" onclick="setMode('auto')">⏱ TỰ ĐỘNG (2s)</div>
    <div class="mode-btn" id="btn-manual" onclick="setMode('manual')">👆 THỦ CÔNG</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:10px">
    <button id="toggle-btn" onclick="toggleRun()"
            style="flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;background:#e74c3c;color:#fff;transition:background 0.2s">
      ⏹ DỪNG
    </button>
    <button id="send-btn" onclick="sendNow()" disabled
            style="flex:1;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;background:#2980b9;color:#fff;transition:background 0.2s">
      ▶ GỬI NGAY
    </button>
  </div>
</div>

<div id="log">Chưa gửi dữ liệu nào</div>

<script>
const BROKER = 'ws://broker.hivemq.com:8000/mqtt';
const TOPIC  = 'gas-fire-alarm/sensors';

let client;
let autoInterval = null;
let isAuto = true;

function connect() {
  client = mqtt.connect(BROKER, {
    clientId: 'controller-' + Math.random().toString(16).slice(2)
  });
  client.on('connect', () => {
    document.getElementById('status-dot').className = 'on';
    document.getElementById('status-text').textContent = 'Đã kết nối MQTT';
    startAuto();
  });
  client.on('error', () => {
    document.getElementById('status-text').textContent = 'Lỗi kết nối';
  });
  client.on('close', () => {
    document.getElementById('status-dot').className = '';
    document.getElementById('status-text').textContent = 'Mất kết nối – đang thử lại...';
  });
}

function getValues() {
  const gas   = parseInt(document.getElementById('gas-slider').value);
  const temp  = parseInt(document.getElementById('temp-slider').value);
  const flame = document.getElementById('flame-toggle').checked;

  let state;
  if (flame)        state = 'CHAY';
  else if (gas >= 500 || temp >= 50) state = 'NGUY HIEM';
  else if (gas >= 300 || temp >= 40) state = 'CANH BAO';
  else              state = 'BINH THUONG';

  return { gas, temp, flame: flame ? 'CO LUA' : 'KHONG', state };
}

function updateState() {
  const { state } = getValues();
  const badge = document.getElementById('state-badge');
  const map = {
    'BINH THUONG': ['#27ae60', '✅ BÌNH THƯỜNG'],
    'CANH BAO':    ['#f39c12', '⚠️ CẢNH BÁO'],
    'NGUY HIEM':   ['#e67e22', '🚨 NGUY HIỂM'],
    'CHAY':        ['#c0392b', '🔥 CHÁY !!!'],
  };
  badge.style.background = map[state][0];
  badge.textContent = map[state][1];
}

function sendNow() {
  if (!client || !client.connected) return;
  const data = getValues();
  client.publish(TOPIC, JSON.stringify(data));
  const now = new Date();
  const t = now.toLocaleTimeString('vi-VN');
  document.getElementById('log').textContent =
    `[${t}] Đã gửi → Gas: ${data.gas} ppm | Nhiệt: ${data.temp}°C | Lửa: ${data.flame} | ${data.state}`;
}

function startAuto() {
  if (autoInterval) clearInterval(autoInterval);
  autoInterval = setInterval(sendNow, 2000);
}

function stopAuto() {
  if (autoInterval) { clearInterval(autoInterval); autoInterval = null; }
}

let isRunning = true;

function toggleRun() {
  isRunning = !isRunning;
  const btn = document.getElementById('toggle-btn');
  if (isRunning) {
    btn.textContent = '⏹ DỪNG';
    btn.style.background = '#e74c3c';
    if (isAuto) startAuto();
  } else {
    btn.textContent = '▶ CHẠY';
    btn.style.background = '#27ae60';
    stopAuto();
  }
}

function setMode(mode) {
  isAuto = mode === 'auto';
  document.getElementById('btn-auto').classList.toggle('active', isAuto);
  document.getElementById('btn-manual').classList.toggle('active', !isAuto);
  document.getElementById('send-btn').disabled = isAuto;
  if (isAuto && isRunning) startAuto(); else stopAuto();
}

function applyPreset(gas, temp, flame) {
  document.getElementById('gas-slider').value = gas;
  document.getElementById('gas-val').textContent = gas;
  document.getElementById('temp-slider').value = temp;
  document.getElementById('temp-val').textContent = temp;
  document.getElementById('flame-toggle').checked = flame;
  updateState();
  if (!isAuto) sendNow();
}

connect();
updateState();
</script>
</body>
</html>
